name: Daily PWA Build & Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 18 * * *'  # Runs every day at 18:30 UTC (00:00 IST)
  workflow_dispatch:      # Allows override manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Service Account & Env
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > service-account.json
          echo "VITE_GOOGLE_DRIVE_API_KEY=${{ secrets.GOOGLE_DRIVE_API_KEY }}" > .env
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          # Add any other required production variables here

      - name: Fetch Latest E-Media Data
        run: node scripts/fetch-emedia.js

      - name: Check for Data Changes
        id: check_changes
        shell: bash
        run: |
          if git diff --quiet src/data/emedia.json; then
            echo "No changes in E-Media data. Skipping build."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "E-Media data changed. Proceeding with build."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build & Deploy PWA
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.check_changes.outputs.changed == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        run: |
          npm run build -- --mode production
          npx firebase-tools deploy --only hosting:web --project antigravity-app-5c1ff
