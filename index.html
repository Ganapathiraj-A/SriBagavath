<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Sri Bagavath</title>
</head>

<body>
  <div id="root"></div>
  <!-- Error Trap for White Screen Debugging -->
  <div id="error-trap" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; color:red; z-index:99999; padding:20px; overflow:auto; font-family:monospace; white-space:pre-wrap;"></div>
  <script>
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      // Ignore benign cross-origin script errors (e.g., from Google Auth / AdBlockers)
      if (msg === 'Script error.' || !url || url.includes('apis.google.com')) {
        console.warn('Ignored cross-origin script error from:', url);
        return false;
      }
      var trap = document.getElementById('error-trap');
      trap.style.display = 'block';
      trap.innerText += "Error: " + msg + "\nURL: " + url + "\nLine: " + lineNo + "\nStack: " + (error ? error.stack : 'N/A') + "\n\n";
      return false;
    };
    window.addEventListener('unhandledrejection', function (event) {
      var trap = document.getElementById('error-trap');
      trap.style.display = 'block';
      trap.innerText += "Unhandled Rejection: " + event.reason + "\n\n";
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
